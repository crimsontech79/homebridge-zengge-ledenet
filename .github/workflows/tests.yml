name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Run tests
        # Includes pacing tests that bind a loopback TCP server, so they need
        # no hardware -- but they are timing-sensitive by nature.
        # Unquoted so the shell expands it: node --test only gained glob
        # support in Node 22, and Node 20 treats the pattern literally.
        run: node --test test/*.test.js
